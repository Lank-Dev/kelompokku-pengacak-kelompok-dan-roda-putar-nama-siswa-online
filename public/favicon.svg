<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer Wheel Ring -->
  <circle cx="32" cy="32" r="30" fill="#0F172A" />
  
  <!-- 6 Pie Segments (60 deg each: 0, 60, 120, 180, 240, 300) -->
  <!-- Segment 1: Blue (0 - 60 deg, from top-right) -->
  <path d="M 32 32 L 32 4 A 28 28 0 0 1 56.25 18 Z" fill="#2563EB" />
  <!-- Segment 2: Emerald (60 - 120 deg) -->
  <path d="M 32 32 L 56.25 18 A 28 28 0 0 1 56.25 46 Z" fill="#059669" />
  <!-- Segment 3: Amber (120 - 180 deg) -->
  <path d="M 32 32 L 56.25 46 A 28 28 0 0 1 32 60 Z" fill="#D97706" />
  <!-- Segment 4: Red (180 - 240 deg) -->
  <path d="M 32 32 L 32 60 A 28 28 0 0 1 7.75 46 Z" fill="#DC2626" />
  <!-- Segment 5: Violet (240 - 300 deg) -->
  <path d="M 32 32 L 7.75 46 A 28 28 0 0 1 7.75 18 Z" fill="#7C3AED" />
  <!-- Segment 6: Teal (300 - 360 deg) -->
  <path d="M 32 32 L 7.75 18 A 28 28 0 0 1 32 4 Z" fill="#0D9488" />

  <!-- Outer Rim Stroke -->
  <circle cx="32" cy="32" r="28" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" fill="none" />

  <!-- Center Hub with Subtle Shadow -->
  <circle cx="32" cy="32" r="10" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="6" fill="#1E293B" />
  <circle cx="32" cy="32" r="2.5" fill="#38BDF8" />

  <!-- Top Pointer Arrow -->
  <path d="M 32 1 L 37 9 L 27 9 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round" />
</svg>
